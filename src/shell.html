<title>Teste Unità</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"Inter Local";src:url(Inter-Regular.ttf) format("truetype");font-weight:400 500;font-display:swap}
@font-face{font-family:"Inter Local";src:url(Inter-Bold.ttf) format("truetype");font-weight:600 800;font-display:swap}
:root{
  --c-brand:#373A36; --c-black:#000000; --c-accent:#FE5000; --c-light:#D0D0CE; --c-white:#FFFFFF;
  --bg:#D0D0CE; --surface:#FFFFFF; --ink:#000000; --ink-2:#373A36;
  --muted:rgba(55,58,54,.68); --line:rgba(55,58,54,.16); --line-2:rgba(55,58,54,.36);
  --head-bg:#373A36; --head-ink:#FFFFFF; --band:rgba(208,208,206,.62); --band-2:rgba(208,208,206,.3);
  --edit:rgba(254,80,0,.055); --edit-focus:rgba(254,80,0,.13); --sel:rgba(254,80,0,.11);
  --accent:#FE5000; --on-accent:#FFFFFF; --title:#373A36; --btn-bg:#FFFFFF;
  --shadow:0 1px 0 rgba(0,0,0,.05),0 10px 30px rgba(0,0,0,.10);
  --font:"Inter","Inter Local",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --surface:#373A36; --ink:#FFFFFF; --ink-2:#D0D0CE;
    --muted:rgba(208,208,206,.72); --line:rgba(208,208,206,.14); --line-2:rgba(208,208,206,.32);
    --head-bg:#000000; --head-ink:#FFFFFF; --band:rgba(0,0,0,.34); --band-2:rgba(0,0,0,.16);
    --edit:rgba(254,80,0,.09); --edit-focus:rgba(254,80,0,.2); --sel:rgba(254,80,0,.2);
    --title:#FE5000; --btn-bg:#373A36; --shadow:0 10px 30px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#373A36; --ink:#FFFFFF; --ink-2:#D0D0CE;
  --muted:rgba(208,208,206,.72); --line:rgba(208,208,206,.14); --line-2:rgba(208,208,206,.32);
  --head-bg:#000000; --head-ink:#FFFFFF; --band:rgba(0,0,0,.34); --band-2:rgba(0,0,0,.16);
  --edit:rgba(254,80,0,.09); --edit-focus:rgba(254,80,0,.2); --sel:rgba(254,80,0,.2);
  --title:#FE5000; --btn-bg:#373A36; --shadow:0 10px 30px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;font-family:var(--font);font-size:13px;color:var(--ink);line-height:1.4;min-height:100vh;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{color:var(--title);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:22px;font-weight:700}
h2{font-size:15px;font-weight:700}
h3{font-size:13px;font-weight:700}
.num,td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)}
.lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}

/* Cabeçalho */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--head-bg);color:var(--head-ink);display:flex;align-items:center;gap:18px;padding:0 16px;min-height:56px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;padding-block:8px;text-decoration:none;color:inherit}
.brand svg{width:34px;height:34px;flex:none}
.brand b{display:block;font-size:15px;letter-spacing:-.01em}
.brand small{display:block;font-size:10.5px;opacity:.72;letter-spacing:.04em}
.tabs{display:flex;gap:2px;flex-wrap:wrap;flex:1}
.tab{background:none;border:0;color:rgba(255,255,255,.78);padding:18px 12px 16px;cursor:pointer;border-bottom:3px solid transparent;font-weight:600;font-size:12.5px}
.tab:hover{color:#FFFFFF}
.tab[aria-current="page"]{color:#FFFFFF;border-bottom-color:var(--accent)}
.tab:disabled{opacity:.35;cursor:not-allowed}
.tab:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.conn{font-size:11px;display:flex;align-items:center;gap:6px;opacity:.85}
.conn i{width:8px;height:8px;border-radius:50%;background:var(--c-light);display:inline-block}
.conn.on i{background:var(--accent)}

main{flex:1;padding:18px 16px 28px;width:100%;max-width:1680px;margin:0 auto}
.foot{background:var(--head-bg);color:rgba(255,255,255,.75);font-size:11px;padding:12px 16px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* Botões */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--btn-bg);color:var(--ink);padding:6px 11px;border-radius:3px;cursor:pointer;font-weight:600;font-size:12px;white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(.95)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--band-2)}
.btn.danger{color:var(--accent);border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{padding:3px 8px;font-size:11.5px}
.btn svg{width:14px;height:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

/* Página */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.page-head p{margin:4px 0 0;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:4px}
.pad{padding:14px 16px}
.stack{display:flex;flex-direction:column;gap:14px}

/* Faixa do orçamento */
.docbar{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:4px;padding:12px 16px;display:flex;gap:16px 28px;flex-wrap:wrap;align-items:center}
.docbar .ttl{min-width:240px;flex:1}
.docbar .ttl b{font-size:15px;color:var(--title);display:block}
.kpis{display:flex;gap:6px 26px;flex-wrap:wrap}
.kpi .v{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .v.acc{color:var(--accent)}
.chip{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:2px;border:1px solid var(--line-2);color:var(--ink-2);white-space:nowrap}
.chip.acc{border-color:var(--accent);color:var(--accent)}
.chip.solid{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip.dark{background:var(--ink-2);border-color:var(--ink-2);color:var(--surface)}

.toolbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line)}
.toolbar .sep{width:1px;height:20px;background:var(--line-2);margin:0 4px}
.search{border:1px solid var(--line-2);background:var(--surface);border-radius:3px;padding:6px 9px;min-width:0;width:240px;max-width:100%}
.search:focus{outline:2px solid var(--accent);outline-offset:-1px}

/* Tabelas */
.tbl-wrap{overflow:auto;max-width:100%}
.tbl-wrap.tall{max-height:min(60vh,720px)}
.tbl-wrap.mid{max-height:min(52vh,620px)}
table.grid{border-collapse:separate;border-spacing:0;width:100%;font-size:12px}
.grid th{position:sticky;top:0;z-index:2;background:var(--head-bg);color:var(--head-ink);font-weight:600;font-size:11px;text-align:left;padding:7px 8px;white-space:nowrap;border-right:1px solid rgba(255,255,255,.08)}
.grid td{padding:0 8px;height:28px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
.grid tbody tr:hover td{background:var(--band-2)}
.grid tr.e0 td{background:var(--band);font-weight:700;color:var(--ink-2)}
.grid tr.e1 td{font-weight:700}
.grid tr.e2 td,.grid tr.e3 td{font-weight:600}
.grid tr.sel td{background:var(--sel)!important}
.grid tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.grid tr.tot td{background:var(--head-bg);color:var(--head-ink);font-weight:700;position:sticky;bottom:0}
.grid td.c-n{font-variant-numeric:tabular-nums;color:var(--ink-2);min-width:78px}
.grid td.c-cod{color:var(--muted);font-size:11.5px}
.grid td.c-desc{min-width:320px;width:40%}
.grid td.c-det{min-width:140px;color:var(--muted)}
.grid .clk{cursor:pointer}
.tog{background:none;border:0;padding:0 4px 0 0;cursor:pointer;color:var(--muted);width:16px;display:inline-block;text-align:center}
.cell{width:100%;border:0;background:var(--edit);padding:4px 6px;border-radius:2px;min-width:0}
.cell:hover{background:var(--edit-focus)}
.cell:focus{outline:1px solid var(--accent);background:var(--edit-focus)}
.cell.num{text-align:right}
.cell.plain{background:transparent}
.cell.plain:hover,.cell.plain:focus{background:var(--edit)}
.cell:disabled{background:transparent}
select.cell{padding:3px 4px}
.warn{color:var(--accent);font-weight:700}
.x{background:none;border:0;cursor:pointer;color:var(--muted);font-size:15px;line-height:1;padding:2px 6px}
.x:hover{color:var(--accent)}

/* Painel de composição */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:4px}
.panel-head{display:flex;gap:12px 20px;align-items:flex-start;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line)}
.panel-head .grow{flex:1;min-width:260px}
.crumbs{display:flex;gap:4px;flex-wrap:wrap;font-size:11.5px;margin-bottom:6px}
.crumbs button{background:none;border:0;padding:0;cursor:pointer;color:var(--accent);font-weight:600}
.crumbs span{color:var(--muted)}
.formula{font-size:11.5px;color:var(--muted);padding:8px 14px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.formula b{color:var(--ink)}
.empty{padding:26px 16px;color:var(--muted);text-align:center}
.tipo{font-size:10.5px;font-weight:700;letter-spacing:.03em}
.tipo.c{color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px}

/* Composições (cadastro) */
.split{display:grid;grid-template-columns:minmax(300px,420px) 1fr;gap:14px;align-items:start}
.list-row{display:grid;grid-template-columns:78px 1fr auto;gap:8px;padding:7px 12px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center}
.list-row:hover{background:var(--band-2)}
.list-row.on{background:var(--sel);box-shadow:inset 3px 0 0 var(--accent)}
.list-row .d{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Indicadores */
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.kbox{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px}
.kbox .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:4px}
.kbox .s{font-size:11px;color:var(--muted);margin-top:2px}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(120px,280px) 1fr 150px 64px;gap:10px;align-items:center}
.bar .t{height:14px;background:var(--band-2);border-radius:2px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--ink-2)}
.bar.lead .t i{background:var(--accent)}
.bar .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cls{font-weight:700;display:inline-block;width:20px;text-align:center;border-radius:2px}
.cls.A{background:var(--accent);color:var(--on-accent)}
.cls.B{background:var(--ink-2);color:var(--surface)}
.cls.C{border:1px solid var(--line-2)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.check{font-size:11.5px;padding:8px 14px;border-top:1px solid var(--line);color:var(--muted)}

/* Formulários e modal */
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px 12px}
.form .wide{grid-column:1/-1}
.fld{display:flex;flex-direction:column;gap:4px}
.fld input,.fld select,.fld textarea{border:1px solid var(--line-2);background:var(--surface);border-radius:3px;padding:6px 8px;min-width:0}
.fld input:focus,.fld select:focus{outline:2px solid var(--accent);outline-offset:-1px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px 16px;overflow:auto}
.modal{background:var(--surface);border-radius:4px;box-shadow:var(--shadow);width:min(760px,100%);border-top:3px solid var(--accent)}
.modal.wide{width:min(1040px,100%)}
.modal header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.modal .body{padding:14px 16px}
.modal footer{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.pk-list{max-height:52vh;overflow:auto;border:1px solid var(--line);border-radius:3px;margin-top:10px}
.pk{display:grid;grid-template-columns:90px 1fr 50px 110px 70px;gap:8px;padding:7px 10px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center}
.pk:hover{background:var(--sel)}
.pk .d{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bdi-box{border:1px solid var(--line);border-radius:3px;padding:12px;margin-top:12px}
.formula-big{font-size:12px;background:var(--band-2);border-radius:3px;padding:8px 10px;margin-top:10px;font-variant-numeric:tabular-nums}

#toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column;gap:8px;max-width:min(420px,calc(100% - 32px))}
.toast{background:var(--c-brand);color:#FFFFFF;padding:10px 14px;border-radius:3px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center;font-size:12.5px;border-left:4px solid var(--c-light)}
.toast.err{border-left-color:var(--accent)}
.toast button{background:none;border:1px solid rgba(255,255,255,.5);color:#FFFFFF;border-radius:2px;padding:2px 8px;cursor:pointer;font-weight:700}
.banner{background:var(--surface);border:1px solid var(--accent);color:var(--ink);padding:8px 12px;border-radius:3px;margin-bottom:12px;font-size:12px}

.steps{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:12px}
.steps span{font-size:11.5px;color:var(--muted)}
.steps span.on{color:var(--accent);font-weight:700}
.drop{border:1.5px dashed var(--line-2);border-radius:4px;padding:26px;text-align:center;background:var(--band-2)}
.radio{display:flex;gap:10px;flex-wrap:wrap}
.radio label{border:1px solid var(--line-2);border-radius:3px;padding:10px 12px;cursor:pointer;display:flex;gap:8px;align-items:flex-start;max-width:360px;background:var(--surface)}
.radio label.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.map-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}


/* Botões de ícone */
.ib{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border:1px solid transparent;border-radius:3px;background:transparent;color:var(--ink-2);cursor:pointer;padding:0}
.ib:hover{background:var(--band-2);border-color:var(--line-2)}
.ib.lg{width:34px;height:32px;border-color:var(--line-2);background:var(--btn-bg)}
.ib.lg svg{width:18px;height:18px}
.ib.danger:hover{color:var(--accent);border-color:var(--accent)}
.ib:disabled{opacity:.35;cursor:not-allowed}
.ib:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.acts{white-space:nowrap}
.tab-ico{display:inline-flex;align-items:center;padding-left:10px;padding-right:10px}
.tab-ico svg{width:19px;height:19px}
.cnt{font-weight:400;opacity:.75;margin-left:2px}
.grid td.c-un{color:var(--ink-2);width:56px}
.grid th.c-com,.grid td.c-com{width:34px;text-align:center;padding:0 4px}
.grid th.c-com svg{width:14px;height:14px;vertical-align:middle}
.ib.com{width:24px;height:24px;opacity:0}
.grid tr:hover .ib.com,.ib.com:focus-visible{opacity:.55}
.ib.com.on{opacity:1;color:var(--accent)}
/* Tela do orçamento com altura travada */
body.fix{height:100vh;height:100dvh;overflow:hidden}
body.fix main{flex:1;min-height:0;display:flex;flex-direction:column;padding-block:12px}
body.fix .foot{padding-block:6px}
.plan{display:flex;flex-direction:column;gap:10px}
body.fix .plan{flex:1;min-height:0}
body.fix .plan .docbar{flex:none;padding-block:8px}
body.fix .plan .grid-card{flex:1 1 56%;min-height:160px;display:flex;flex-direction:column}
body.fix .plan .grid-card .tbl-wrap{flex:1;min-height:0;max-height:none}
body.fix .plan #comp-panel{flex:1 1 44%;min-height:150px;display:flex;flex-direction:column;overflow:hidden}
body.fix .plan #comp-panel > .tbl-wrap{flex:1;min-height:0;max-height:none}
body.fix .plan #comp-panel > .empty{overflow:auto}
@media (max-width:900px){body.fix{height:auto;overflow:visible}body.fix .plan .grid-card .tbl-wrap{max-height:60vh}}
@media (max-width:900px){
  .split,.two{grid-template-columns:1fr}
  .bar{grid-template-columns:110px 1fr 110px}
  .bar .p{display:none}
  .tabs{order:3;flex:1 0 100%;flex-wrap:nowrap;overflow-x:auto;margin:0 -16px;padding:0 10px}
  .tab{padding:10px 9px}
  .top{gap:6px 12px}
  .conn{margin-left:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Home: tabela centralizada, coluna Orçamento à esquerda */
table.grid.orcs-tbl th,table.grid.orcs-tbl td{text-align:center}
table.grid.orcs-tbl th.c-orc,table.grid.orcs-tbl td.c-orc{text-align:left}
table.grid.orcs-tbl td.acts{width:1%}
/* Filtro de tipo em um botão de escolha */
.sel-btn{position:relative;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:var(--btn-bg);border-radius:3px;padding:0 0 0 11px;cursor:pointer}
.sel-btn:hover{border-color:var(--ink-2)}
.sel-btn.on{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.sel-btn select{appearance:none;-webkit-appearance:none;border:0;background:transparent;font-weight:600;font-size:12px;padding:6px 30px 6px 0;cursor:pointer;color:var(--ink)}
.sel-btn select:focus{outline:none}
.sel-btn:focus-within{outline:2px solid var(--accent);outline-offset:-1px}
.sel-btn::after{content:"";position:absolute;right:11px;top:50%;width:6px;height:6px;border-right:1.5px solid var(--ink-2);border-bottom:1.5px solid var(--ink-2);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.sel-btn option{color:#000;background:#fff}
.grid th.num{text-align:right}
.cell.nin{display:inline-block;width:calc(100% - 20px);min-width:70px;padding:3px 4px;font-weight:inherit;font-variant-numeric:tabular-nums;color:inherit}
.comp-hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.comp-cod{font-size:12px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.comp-nome{flex:1;min-width:220px;font-size:15px;font-weight:700;color:var(--title)}
/* Cabeçalho compacto da composição na aba Orçamento */
.panel.orc .panel-head{padding:6px 12px;align-items:center;gap:6px 18px}
.panel.orc .comp-hd{gap:8px}
.panel.orc .comp-cod{font-size:10.5px}
.panel.orc .comp-nome{font-size:12.5px;padding:2px 4px}
.panel.orc .kpis{gap:4px 18px;align-items:center}
.panel.orc .kpi{display:flex;align-items:baseline;gap:6px}
.panel.orc .kpi .lbl{font-size:9.5px}
.panel.orc .kpi .v{font-size:12.5px}
.panel.orc .kpi input.cell{font-size:12.5px!important;width:110px!important;padding:2px 4px}
/* Aba Exportar */
.seg{display:inline-flex}
.seg .btn{border-radius:0}
.seg .btn:first-child{border-radius:3px 0 0 3px}
.seg .btn:last-child{border-radius:0 3px 3px 0;margin-left:-1px}
.exp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.exp-opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line-2);border-radius:4px;padding:10px 12px;cursor:pointer;background:var(--surface)}
.exp-opt:hover{border-color:var(--ink-2)}
.exp-opt.on{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.exp-opt input{margin-top:2px;accent-color:var(--accent)}
.exp-opt > span{display:flex;flex-direction:column;gap:2px}
.exp-opt .muted{font-size:11.5px}
.btn.primary svg{stroke:currentColor}
/* Aba Dados */
.fgrp{margin:10px 0 -2px;padding-bottom:4px;border-bottom:1px solid var(--line);font-size:12px;font-weight:700;color:var(--title);text-transform:uppercase;letter-spacing:.05em}
